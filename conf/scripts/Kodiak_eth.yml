exchange: orderly_perpetual
trading_pair: ETH-USDC
order_amount_quote: [200, 500] #in USD
bid_spread_levels: [0.00035, 0.0007] #in bps
ask_spread_levels: [0.00035, 0.0007] #in bps
order_refresh_time: 4 #in seconds
max_inventory: 1 #in ETH terms
max_price_adjustment: 0.0012 #0.12% maximum skew to fair price at max inventory
min_inventory_pct_for_adjustment: 0.1 #25% of max inventory: no adjustment
max_spread_widening: 0.5 #spreads widen up to 50%
randomization: 0.25 #20%
leverage: 100
