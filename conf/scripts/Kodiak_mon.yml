exchange: orderly_perpetual
trading_pair: MON-USDC
order_size: [0.25, 0.5, 0.75, 1] #in MON
bid_spread_levels: [0.001, 0.002, 0.003] #in bps
ask_spread_levels: [0.001, 0.002, 0.003] #in bps
order_refresh_time: 10 #in seconds
max_inventory: 1000000 #in MON terms
max_price_adjustment: 0.005 #0.5% maximum skew to fair price at max inventory
min_inventory_pct_for_adjustment: 0.05 #5% of max inventory: no adjustment
max_spread_mult: 2.0 #spreads widen up to 100%
randomization: 0.2 #20%
leverage: 10
order_cooldown: 20
ema_window: 100
target_inventory: 500000
order_tag: ""
